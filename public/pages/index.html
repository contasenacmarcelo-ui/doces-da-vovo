<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Doces da Vovó</title>
</head>
<body>
    <nav id="header">
        <h1>Doces da Vovó</h1>
        <img id="img" src="/assets/Vovó Acolhedora em Tons Quentes.png" alt="">

    </nav>
    <form id="formulario"> 
        <label for="nome">nome</label>
        <input placeholder="Digite seu nome:" type="text" name="nome" id="nome">
        <label for="email">email</label>
        <input placeholder="Digite seu email:" type="text" name="email" id="email">
        <label for="pedido">pedido</label>
        <textarea placeholder="Digite seu pedido:" name="pedido" id="pedido"></textarea>
        <button type="submit" id="btn">Enviar</button>
    </form>
    <hr>
    <p id="exibirMensagem"></p>
    <ul id="listarPedidos"></ul>
    <script src="../js/script.js"></script>
</body>
</html>
